<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; font-weight: 400; src: url(fonts/Cinzel-Regular.woff); }
  @font-face { font-family: Cinzel; font-weight: 700; src: url(fonts/Cinzel-Bold.woff); }
  @font-face { font-family: CinzelDeco; font-weight: 700; src: url(fonts/CinzelDecorative-Bold.woff); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Ganesha and the Race Around the World" — a storybook short.
// Everything is drawn procedurally in a 360x640 logical space, rendered at 3x.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 360, H = 640, S = 3;
const DURATION = 79;

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeIn = t => { t = clamp(t, 0, 1); return t * t * t; };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }

const PAL = {
  gold: '#e9bb62', gold2: '#b9852f', red: '#b5402e', red2: '#7e2419', teal: '#5fb7a8',
  cream: '#f3e5c4', ink: '#1c130c', wall: '#2c1e14', wall2: '#170f09',
  shiva: '#6aa3c6', parvati: '#e2a274', gan: '#e59a55', kart: '#e7b88a', hl: '#82d8c9'
};

let SIL = false;       // silhouette mode: everything flat dark
const SILC = '#1e150e';
function P(f) { X.beginPath(); f(); }
function fs(fill, stroke = PAL.gold, lw = 0.9) {
  if (SIL) { if (fill) { X.fillStyle = SILC; X.fill(); } return; }
  if (fill) { X.fillStyle = fill; X.fill(); }
  if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); }
}
function ell(x, y, rx, ry, rot = 0) { X.ellipse(x, y, rx, ry, rot, 0, TAU); }
function glow(x, y, r, col, a = 1) {
  if (SIL || a <= 0) return;
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.4, rgba(col, a * 0.35)); g.addColorStop(1, rgba(col, 0));
  X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function limb(pts, col, w) { // thick limb with gold outline
  const path = () => { X.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]); };
  X.lineCap = 'round'; X.lineJoin = 'round';
  if (!SIL) { P(path); X.strokeStyle = PAL.gold; X.lineWidth = w + 1.8; X.stroke(); }
  P(path); X.strokeStyle = SIL ? SILC : col; X.lineWidth = w; X.stroke();
}
function trim(f, col = PAL.gold, dash = [1, 2.2], lw = 0.9) {
  if (SIL) return; P(f); X.setLineDash(dash); X.strokeStyle = col; X.lineWidth = lw; X.stroke(); X.setLineDash([]);
}
function rods(pts) { // shadow-puppet control rods
  X.save(); X.strokeStyle = 'rgba(15,9,5,0.85)'; X.lineWidth = 1.1;
  for (const [x, y] of pts) { P(() => { X.moveTo(x, y); X.lineTo(x + (x > 0 ? 8 : -8), 400); }); X.stroke(); }
  X.restore();
}
function sparkle(x, y, r, a, col = '#fff6dc') {
  if (a <= 0) return;
  X.save(); X.globalAlpha = a; X.fillStyle = col; X.translate(x, y);
  P(() => { X.moveTo(0, -r); X.quadraticCurveTo(0, 0, r, 0); X.quadraticCurveTo(0, 0, 0, r); X.quadraticCurveTo(0, 0, -r, 0); X.quadraticCurveTo(0, 0, 0, -r); });
  X.fill(); X.restore(); glow(x, y, r * 2.5, '#ffe7a8', a * 0.5);
}

// ---------- props ----------
function fruit(x, y, s, g = 1) {
  glow(x, y, 46 * s * (0.8 + 0.2 * g), '#ffd36b', 0.55 * g);
  X.save(); X.translate(x, y); X.scale(s, s);
  const gr = X.createRadialGradient(-4, -4, 1, 0, 0, 13);
  gr.addColorStop(0, '#fff3b0'); gr.addColorStop(0.5, '#f4c443'); gr.addColorStop(1, '#c9831f');
  P(() => { X.moveTo(0, -12); X.bezierCurveTo(11, -12, 13, 4, 4, 11); X.bezierCurveTo(-3, 15, -12, 8, -11, -1); X.bezierCurveTo(-10, -9, -5, -12, 0, -12); });
  fs(SIL ? SILC : gr, '#8a5714', 0.8);
  P(() => { X.moveTo(0, -12); X.quadraticCurveTo(8, -20, 15, -15); X.quadraticCurveTo(7, -10, 0, -12); }); fs('#6f9a4a', '#3d5a26', 0.6);
  X.restore();
}
function modak(x, y) { P(() => { X.moveTo(x - 4, y + 3); X.quadraticCurveTo(x, y - 9, x + 4, y + 3); X.closePath(); }); fs('#f4ead2', PAL.gold2, 0.6); }

// ---------- characters (feet at origin, ~1 unit = 1px at s=1) ----------
function ganesha(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s * (o.dir || 1), s);
  const wk = o.walk || 0, bob = o.walk != null ? -Math.abs(Math.sin(wk)) * 2.5 : 0;
  if (o.rods !== false) rods([[-30, -70], [30, -78]]);
  X.translate(0, bob);
  const sw = o.walk != null ? Math.sin(wk) * 6 : 0;
  P(() => X.roundRect(-19 + sw, -32, 14, 32, 5)); fs(PAL.gan);
  P(() => X.roundRect(5 - sw, -32, 14, 32, 5)); fs(PAL.gan);
  // upper body can bow
  X.translate(0, -58); X.rotate(o.bow || 0); X.translate(0, 58);
  // dhoti
  P(() => { X.moveTo(-27, -64); X.lineTo(27, -64); X.lineTo(23, -24); X.quadraticCurveTo(0, -16, -23, -24); X.closePath(); }); fs('#d8a127');
  trim(() => { X.moveTo(-24, -27); X.quadraticCurveTo(0, -20, 24, -27); });
  // belly
  P(() => ell(0, -80, 27, 23)); fs(PAL.gan);
  P(() => { X.moveTo(-22, -96); X.quadraticCurveTo(0, -72, 25, -64); }); X.strokeStyle = SIL ? SILC : PAL.red; X.lineWidth = 3; X.stroke();
  // arms
  if (o.namaste) {
    limb([[-22, -96], [-16, -78], [-3, -90]], PAL.gan, 7); limb([[22, -96], [16, -78], [3, -90]], PAL.gan, 7);
    P(() => { X.moveTo(-3, -84); X.lineTo(0, -102); X.lineTo(3, -84); X.closePath(); }); fs(PAL.gan);
  } else {
    limb([[-23, -96], [-33, -78], [-30, -64]], PAL.gan, 7);
    const hy = o.hold ? -76 : -100;
    limb([[23, -96], [34, -86], [30, hy]], PAL.gan, 7);
    if (!o.hold) { P(() => ell(31, hy - 3, 5, 6)); fs(PAL.gan); }
    modak(-29, -61);
    P(() => ell(-31, -68, 4, 1.4)); fs(PAL.gold, null);
  }
  // back arms (faint) with axe and lotus
  if (!SIL) {
    X.save(); X.globalAlpha = 0.85;
    limb([[-20, -100], [-38, -112], [-42, -124]], PAL.gan, 5); limb([[20, -100], [38, -112], [42, -124]], PAL.gan, 5);
    P(() => { X.moveTo(-42, -124); X.lineTo(-46, -150); }); X.strokeStyle = PAL.gold2; X.lineWidth = 1.5; X.stroke();
    P(() => { X.moveTo(-46, -150); X.quadraticCurveTo(-56, -146, -52, -138); X.lineTo(-45, -143); X.closePath(); }); fs('#d9d4c9', PAL.gold2, 0.6);
    for (let i = -2; i <= 2; i++) { P(() => ell(42 + i * 2.5, -128, 2.4, 6, i * 0.35)); fs('#f08aa0', '#b04a64', 0.5); }
    X.restore();
  } else {
    limb([[-20, -100], [-38, -112], [-42, -124]], PAL.gan, 5); limb([[20, -100], [38, -112], [42, -124]], PAL.gan, 5);
  }
  // necklace
  trim(() => { X.arc(0, -104, 12, 0.3, Math.PI - 0.3); }, PAL.gold, [1.4, 1.8], 1.6);
  // ears
  for (const sx of [-1, 1]) {
    P(() => { X.moveTo(sx * 10, -142); X.bezierCurveTo(sx * 36, -150, sx * 38, -114, sx * 16, -110); X.closePath(); }); fs(PAL.gan);
    P(() => { X.moveTo(sx * 13, -138); X.bezierCurveTo(sx * 30, -143, sx * 31, -119, sx * 17, -115); X.closePath(); }); fs('#e8857a', null);
  }
  // head
  P(() => ell(0, -128, 17, 18)); fs(PAL.gan);
  // trunk
  const tw = (o.trunk || 0);
  const trunkPath = () => { X.moveTo(0, -120); X.bezierCurveTo(4, -100, -4, -92, 6 + tw * 4, -84); X.quadraticCurveTo(14 + tw * 6, -82, 13 + tw * 4, -90); };
  X.lineCap = 'round';
  if (!SIL) { P(trunkPath); X.strokeStyle = PAL.gold; X.lineWidth = 10.5; X.stroke(); }
  P(trunkPath); X.strokeStyle = SIL ? SILC : PAL.gan; X.lineWidth = 8.5; X.stroke();
  trim(() => { X.moveTo(-3, -110); X.lineTo(3, -110); X.moveTo(-3, -104); X.lineTo(3, -104); X.moveTo(-2, -98); X.lineTo(4, -97); }, '#b86a35', [], 0.7);
  // tusk
  P(() => { X.moveTo(8, -116); X.quadraticCurveTo(15, -112, 17, -104); X.lineTo(11, -110); X.closePath(); }); fs('#fbf3df', '#b9a27a', 0.5);
  // eyes + smile
  if (!SIL) {
    const blink = o.blink ? 0.2 : 1;
    for (const ex of [-7, 7]) { P(() => ell(ex, -131, 2.2, 2.6 * blink)); X.fillStyle = '#1b120b'; X.fill(); P(() => ell(ex + 0.7, -132, 0.7, 0.7)); X.fillStyle = '#fff'; X.fill(); }
    const sm = o.smile || 0;
    P(() => { X.moveTo(-9, -118); X.quadraticCurveTo(-5, -114 + sm * 4, -1, -117); }); X.strokeStyle = '#7a3a1c'; X.lineWidth = 0.9 + sm * 0.5; X.stroke();
    P(() => ell(0, -142, 2.2, 3)); X.fillStyle = PAL.red; X.fill();
    trim(() => { X.moveTo(-8, -137); X.quadraticCurveTo(0, -140, 8, -137); }, '#f8f0e0', [], 1.2);
  }
  // crown
  P(() => { X.moveTo(-15, -142); X.lineTo(15, -142); X.lineTo(11, -156); X.lineTo(7, -170); X.lineTo(3, -184); X.lineTo(0, -192); X.lineTo(-3, -184); X.lineTo(-7, -170); X.lineTo(-11, -156); X.closePath(); }); fs('#e9bb3a', '#9b6a1c', 0.8);
  trim(() => { X.moveTo(-12, -156); X.lineTo(12, -156); X.moveTo(-8, -170); X.lineTo(8, -170); }, PAL.red, [], 1.4);
  P(() => ell(0, -149, 3, 3)); fs(PAL.red, PAL.gold, 0.6);
  X.restore();
}

function kartikeya(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s * (o.dir || 1), s);
  if (o.rods !== false) rods([[-18, -80], [22, -96]]);
  const breathe = o.pant ? Math.sin(o.pant) * 1.5 : 0;
  X.translate(0, breathe * 0.5);
  limb([[-6, -58], [-8, -30], [-7, 0]], PAL.kart, 7); limb([[6, -58], [8, -30], [7, 0]], PAL.kart, 7);
  P(() => { X.moveTo(-14, -82); X.lineTo(14, -82); X.lineTo(17, -40); X.quadraticCurveTo(0, -34, -17, -40); X.closePath(); }); fs(PAL.red);
  trim(() => { X.moveTo(-16, -44); X.quadraticCurveTo(0, -38, 16, -44); });
  P(() => { X.moveTo(-14, -122 - breathe); X.lineTo(14, -122 - breathe); X.lineTo(12, -82); X.lineTo(-12, -82); X.closePath(); }); fs(PAL.kart);
  trim(() => { X.moveTo(-12, -120); X.lineTo(10, -84); }, '#f7f0e2', [], 1);
  trim(() => { X.arc(0, -120, 9, 0.3, Math.PI - 0.3); }, PAL.gold, [1.4, 1.8], 1.6);
  // arms + spear (vel)
  limb([[-14, -118], [-22, -96], [-16, -80]], PAL.kart, 5.5);
  limb([[14, -118], [24, -102], [26, -112]], PAL.kart, 5.5);
  if (!o.noSpear) {
    P(() => { X.moveTo(27, 8); X.lineTo(27, -178); }); X.strokeStyle = SIL ? SILC : '#8b5a2b'; X.lineWidth = 2; X.stroke();
    P(() => { X.moveTo(27, -200); X.quadraticCurveTo(36, -186, 27, -174); X.quadraticCurveTo(18, -186, 27, -200); }); fs('#f0c85a', '#8e6118', 0.7);
    glow(27, -188, 14, '#ffe08a', 0.35);
  }
  // head
  P(() => X.rect(-4, -130, 8, 8)); fs(PAL.kart, null);
  P(() => ell(0, -140, 11, 12)); fs(PAL.kart);
  if (!SIL) {
    P(() => ell(4, -142, 1.6, 1.9)); X.fillStyle = '#1b120b'; X.fill();
    P(() => { X.moveTo(1, -134); X.quadraticCurveTo(4, -132 + (o.tired ? -1.5 : 1.5), 7, -134); }); X.strokeStyle = '#7a3a1c'; X.lineWidth = 0.9; X.stroke();
    P(() => { X.moveTo(-11, -142); X.quadraticCurveTo(-15, -128, -9, -120); X.lineTo(-6, -138); X.closePath(); }); X.fillStyle = '#1d140e'; X.fill();
  }
  P(() => { X.moveTo(-11, -148); X.lineTo(11, -148); X.lineTo(6, -170); X.lineTo(0, -190); X.lineTo(-6, -170); X.closePath(); }); fs('#e9bb3a', '#9b6a1c', 0.8);
  trim(() => { X.moveTo(-8, -158); X.lineTo(8, -158); X.moveTo(-5, -170); X.lineTo(5, -170); }, PAL.red, [], 1.3);
  if (o.tired && !SIL) { for (let i = 0; i < 2; i++) { const p = ((o.pant || 0) / 4 + i * 0.5) % 1; P(() => ell(-14 - p * 4, -150 + p * 18, 1.4, 2.2)); X.fillStyle = `rgba(160,220,255,${1 - p})`; X.fill(); } }
  X.restore();
}

function seated(x, y, s, kind, o = {}) {
  const skin = kind === 'shiva' ? PAL.shiva : PAL.parvati;
  X.save(); X.translate(x, y); X.scale(s * (o.dir || 1), s);
  // halo
  if (!SIL) {
    P(() => X.arc(0, -86, 30, 0, TAU)); X.fillStyle = 'rgba(233,187,98,0.12)'; X.fill();
    trim(() => X.arc(0, -86, 30, 0, TAU), PAL.gold, [], 1.2);
    trim(() => X.arc(0, -86, 34, 0, TAU), PAL.gold, [1, 3], 1);
  }
  if (kind === 'parvati') { P(() => { X.moveTo(-12, -96); X.quadraticCurveTo(-20, -50, -14, -30); X.lineTo(10, -30); X.quadraticCurveTo(16, -60, 12, -96); X.closePath(); }); fs('#1d140e', null); }
  // lap / legs
  const lap = kind === 'shiva' ? '#d48a3a' : PAL.red;
  P(() => { X.moveTo(-40, -2); X.quadraticCurveTo(-44, -26, -14, -30); X.lineTo(14, -30); X.quadraticCurveTo(44, -26, 40, -2); X.quadraticCurveTo(0, 6, -40, -2); }); fs(lap);
  if (kind === 'shiva' && !SIL) { X.strokeStyle = '#3a2210'; X.lineWidth = 1.6; for (let i = -3; i <= 3; i++) { P(() => { X.moveTo(i * 10 - 3, -24); X.quadraticCurveTo(i * 10, -14, i * 10 + 2, -6); }); X.stroke(); } }
  trim(() => { X.moveTo(-38, -4); X.quadraticCurveTo(0, 4, 38, -4); });
  // torso
  P(() => { X.moveTo(-17, -30); X.lineTo(17, -30); X.lineTo(14, -72); X.quadraticCurveTo(0, -78, -14, -72); X.closePath(); }); fs(skin);
  if (kind === 'parvati') { P(() => { X.moveTo(-17, -30); X.lineTo(4, -30); X.lineTo(12, -72); X.lineTo(4, -72); X.closePath(); }); fs(PAL.red); trim(() => { X.moveTo(-14, -32); X.lineTo(10, -70); }); }
  // arms
  const raise = o.raise || 0;
  limb([[-14, -68], [-24, -46], [-12, -34]], skin, 6);
  limb([[14, -68], [lerp(24, 26, raise), lerp(-46, -82, raise)], [lerp(14, 28, raise), lerp(-36, -100, raise)]], skin, 6);
  if (raise > 0.5 && !SIL) { P(() => ell(28, -104, 4, 6)); fs(skin); }
  // neck ornaments
  if (kind === 'shiva') {
    trim(() => X.arc(0, -70, 10, 0.2, Math.PI - 0.2), '#7a4a2a', [1.6, 1.4], 2);
    if (!SIL) { P(() => { X.moveTo(-12, -74); X.quadraticCurveTo(0, -60, 12, -74); X.quadraticCurveTo(16, -82, 18, -88); }); X.strokeStyle = '#3f8a72'; X.lineWidth = 2.5; X.stroke(); P(() => ell(18, -89, 2.6, 1.8, -0.6)); X.fillStyle = '#3f8a72'; X.fill(); }
  } else trim(() => X.arc(0, -72, 9, 0.2, Math.PI - 0.2), PAL.gold, [1.4, 1.6], 1.8);
  // head
  P(() => X.rect(-4, -80, 8, 6)); fs(skin, null);
  P(() => ell(0, -88, 12, 13)); fs(skin);
  if (!SIL) {
    const bl = o.blink ? 0.2 : 1;
    for (const ex of [-4.5, 4.5]) { P(() => ell(ex, -89, 2.2, 1.2 * bl)); X.fillStyle = '#1b120b'; X.fill(); }
    P(() => { X.moveTo(-3, -82); X.quadraticCurveTo(0, -80, 3, -82); }); X.strokeStyle = '#6a2a1a'; X.lineWidth = 0.9; X.stroke();
    if (kind === 'shiva') { trim(() => { X.moveTo(-6, -96); X.lineTo(6, -96); X.moveTo(-6, -98); X.lineTo(6, -98); }, '#f4efe4', [], 0.7); P(() => ell(0, -97, 1.2, 2)); X.fillStyle = PAL.red; X.fill(); }
    else { P(() => ell(0, -96, 1.5, 1.5)); X.fillStyle = PAL.red; X.fill(); }
  }
  if (kind === 'shiva') {
    P(() => { X.moveTo(-11, -96); X.quadraticCurveTo(-14, -118, -2, -126); X.quadraticCurveTo(10, -124, 11, -96); X.closePath(); }); fs('#20170f', '#4a3424', 0.8);
    trim(() => { X.moveTo(-8, -108); X.lineTo(8, -108); X.moveTo(-6, -116); X.lineTo(6, -116); }, '#6b5132', [], 1);
    if (!SIL) { P(() => { X.arc(8, -122, 6, -1.9, 1.1); X.arc(10, -124, 5, 1.1, -1.9, true); }); X.fillStyle = '#f6f0d8'; X.fill(); }
    if (o.trident) { P(() => { X.moveTo(-46, 0); X.lineTo(-46, -140); }); X.strokeStyle = SIL ? SILC : '#8d8d8d'; X.lineWidth = 2; X.stroke();
      P(() => { X.moveTo(-56, -150); X.quadraticCurveTo(-56, -136, -46, -136); X.quadraticCurveTo(-36, -136, -36, -150); X.moveTo(-46, -136); X.lineTo(-46, -158); }); X.strokeStyle = SIL ? SILC : '#cfcfcf'; X.lineWidth = 2; X.stroke(); }
  } else {
    P(() => { X.moveTo(-12, -94); X.lineTo(12, -94); X.lineTo(9, -110); X.lineTo(4, -104); X.lineTo(0, -118); X.lineTo(-4, -104); X.lineTo(-9, -110); X.closePath(); }); fs('#e9bb3a', '#9b6a1c', 0.7);
  }
  X.restore();
}

function peacock(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s * (o.dir || 1), s);
  const fan = o.fan || 0, fly = o.fly, fl = o.flap || 0;
  if (fan > 0.01) {
    const n = 15;
    for (let i = 0; i < n; i++) {
      const a = lerp(-Math.PI / 2 - 0.2, -Math.PI / 2 - 0.2, 0) + lerp(-1.25, 1.25, i / (n - 1)) * fan - 0.35;
      X.save(); X.translate(-8, -18); X.rotate(a + Math.PI / 2);
      const L = 60 * (0.6 + 0.4 * fan);
      P(() => ell(0, -L / 2, 7, L / 2)); fs('#2c6e5a', '#1a4a3c', 0.6);
      P(() => ell(0, -L + 8, 6, 7)); fs('#d8b545', null); P(() => ell(0, -L + 8, 4, 5)); fs('#2a8aa0', null); P(() => ell(0, -L + 8.5, 2, 2.6)); fs('#152a55', null);
      X.restore();
    }
  } else {
    // trailing tail
    for (let i = -3; i <= 3; i++) {
      X.save(); X.translate(-14, -12); X.rotate(Math.PI + i * 0.06 + (fly ? Math.sin(fl * 0.7 + i) * 0.03 : 0.35));
      P(() => ell(32, 0, 34, 4)); fs('#2c6e5a', '#1a4a3c', 0.5);
      P(() => ell(58, 0, 5, 4)); fs('#d8b545', null); P(() => ell(58, 0, 3, 2.6)); fs('#152a55', null);
      X.restore();
    }
  }
  if (!fly) { limb([[-2, -8], [-4, 8]], '#b98a4a', 1.5); limb([[4, -8], [6, 8]], '#b98a4a', 1.5); }
  // body
  const bg = SIL ? SILC : (() => { const g = X.createLinearGradient(0, -30, 0, 0); g.addColorStop(0, '#2f7fb8'); g.addColorStop(1, '#1d4f86'); return g; })();

      const y0 = 330 + L * 46, sp = (L + 1) * 14, col = L % 2 ? '#1f6d7c' : '#2a8794';
      P(() => { X.moveTo(-50, H + 50); for (let x = -50; x <= W + 50; x += 6) X.lineTo(x, y0 + Math.sin((x + st * sp * 3) * 0.05 + L) * 6); X.lineTo(W + 50, H + 50); X.closePath(); }); X.fillStyle = col; X.fill();
      X.strokeStyle = 'rgba(240,248,240,0.75)'; X.lineWidth = 1.2; X.setLineDash([10, 8]); X.lineDashOffset = -st * sp;
      P(() => { for (let x = -50; x <= W + 50; x += 6) { const yy = y0 + Math.sin((x + st * sp * 3) * 0.05 + L) * 6; x === -50 ? X.moveTo(x, yy) : X.lineTo(x, yy); } }); X.stroke(); X.setLineDash([]);
    }
    riderGroup(lerp(-60, 430, st / 2), 230 + Math.sin(st * 5) * 8, 1.1, { flap: t * 20 });
  } else if (sub === 1) { // mountains
    const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#101a38'); g.addColorStop(1, '#5a4060'); X.fillStyle = g; X.fillRect(-100, -100, W + 200, H + 200);
    starfield(t, 0.8, 360);
    const ranges = [['#3b4466', 380, 10, 90], ['#2b3150', 450, 30, 110], ['#1b1d30', 530, 70, 120]];
    ranges.forEach(([col, base, sp, h], k) => {
      const off = -(st * sp * 4) % 120;
      P(() => { X.moveTo(-100, H + 50); for (let i = -1; i < 7; i++) { const x = off + i * 120; X.lineTo(x, base); X.lineTo(x + 60, base - h * (0.7 + 0.3 * ((i * 7 + k) % 3) / 2)); } X.lineTo(W + 150, base); X.lineTo(W + 150, H + 50); X.closePath(); });
      X.fillStyle = col; X.fill();
      for (let i = -1; i < 7; i++) { const x = off + i * 120, hh = h * (0.7 + 0.3 * ((i * 7 + k) % 3) / 2); P(() => { X.moveTo(x + 60, base - hh); X.lineTo(x + 60 - 14, base - hh + 22); X.lineTo(x + 60, base - hh + 16); X.lineTo(x + 60 + 14, base - hh + 22); X.closePath(); }); X.fillStyle = 'rgba(235,240,250,0.85)'; X.fill(); }
      if (k === 0) riderGroup(lerp(-60, 430, st / 2), 200 + Math.sin(st * 5) * 8, 0.95, { flap: t * 20 });
    });
  } else { // every land — orbit the globe
    X.fillStyle = '#0c1024'; X.fillRect(-100, -100, W + 200, H + 200); starfield(t, 1);
    const a = st * 2.4 - 1.2, ox = 180 + Math.cos(a) * 150, oy = 360 + Math.sin(a) * 50, behind = Math.sin(a) < 0;
    const drawRider = () => { const vx = -Math.sin(a); riderGroup(ox, oy - 10, behind ? 0.55 : 0.8, { flap: t * 20, dir: vx >= 0 ? 1 : -1 }); };
    X.strokeStyle = 'rgba(130,216,201,0.35)'; X.lineWidth = 1.2; P(() => ell(180, 360, 150, 50)); X.stroke();
    if (behind) drawRider();
    globe(180, 360, 115, st * 0.9);
    if (!behind) drawRider();
  }
  // quick dips between sub-scenes
  const dip = Math.max(1 - Math.abs(lt - 2) / 0.12, 1 - Math.abs(lt - 4) / 0.12, 0);
  if (dip > 0) { X.fillStyle = `rgba(0,0,0,${dip})`; X.fillRect(-100, -100, W + 200, H + 200); }
}

function sCircle(lt, t) {
  palaceBG(t);
  const cx = 180, cy = 445, rx = 128, ry = 42;
  const lapT = seg(lt, 1.5, 7.5) * 3;            // 0..3 laps
  const th = Math.PI / 2 + lapT * TAU;
  // path glow
  const drawn = Math.min(lapT, 1);
  X.save(); X.lineCap = 'round';
  const lw = 1.5 + Math.min(lapT, 3) * 0.9;
  X.strokeStyle = 'rgba(255,214,120,0.25)'; X.lineWidth = lw * 4; P(() => X.ellipse(cx, cy, rx, ry, 0, Math.PI / 2 - 0.0001, Math.PI / 2 + drawn * TAU)); X.stroke();
  X.strokeStyle = 'rgba(255,224,150,0.9)'; X.lineWidth = lw; P(() => X.ellipse(cx, cy, rx, ry, 0, Math.PI / 2 - 0.0001, Math.PI / 2 + drawn * TAU)); X.stroke();
  X.restore();
  for (const k of [3.5, 5.5, 7.5]) { const p = seg(lt, k, k + 1.2); if (p > 0 && p < 1) { X.strokeStyle = `rgba(255,230,160,${1 - p})`; X.lineWidth = 2; P(() => ell(cx, cy, rx * (1 + p * 0.5), ry * (1 + p * 0.5))); X.stroke(); } }
  // ganesha pos: param x = cx + rx*cos(th), y = cy + ry*sin(th)
  const walking = lt > 0.2 && lt < 7.5;
  let gx, gy, gth;
  if (lt < 1.5) { gth = Math.PI / 2; const p = ease(seg(lt, 0.2, 1.5)); gx = lerp(390, cx, p); gy = lerp(cy + ry + 30, cy + ry, p); }
  else { gth = th; gx = cx + rx * Math.cos(gth); gy = cy + ry * Math.sin(gth); }
  if (lt >= 7.5) { gx = cx; gy = cy + ry; }
  const depth = (gy - (cy - ry)) / (2 * ry); // 0 back .. 1 front
  const vx = lt < 1.5 ? -1 : -Math.sin(gth);
  const mth = gth - 0.45, mx = cx + rx * Math.cos(mth), my = cy + ry * Math.sin(mth), mdepth = (my - (cy - ry)) / (2 * ry);
  const drawG = () => ganesha(gx, gy, lerp(0.42, 0.62, depth), { dir: lt >= 7.5 ? 1 : (vx >= 0 ? 1 : -1), walk: walking ? lt * 9 : null, smile: 0.6, namaste: lt >= 7.6 });
  const drawM = () => { if (lt > 1.5 && lt < 7.5) mouse(mx, my, lerp(0.55, 0.85, mdepth), { dir: -Math.sin(mth) >= 0 ? 1 : -1, hop: Math.max(0, Math.sin(lt * 14)) * 2 }); };
  if (depth < 0.5) drawG(); if (mdepth < 0.5) drawM();
  dais(cx, 452, 130);
  seated(150, 446, 0.78, 'shiva', { blink: (lt % 3.3) < 0.12 }); seated(212, 446, 0.74, 'parvati', { blink: ((lt + 1) % 3.9) < 0.12 });
  if (depth >= 0.5) drawG(); if (mdepth >= 0.5) drawM();
  if (lt > 7.5) for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + lt * 0.5; sparkle(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, 2.5, seg(lt, 7.5, 8) * (0.5 + 0.5 * Math.sin(lt * 4 + i))); }
}

function sGift(lt, t) {
  palaceBG(t); dais(150, 462, 160);
  seated(112, 455, 0.9, 'shiva', { raise: ease(seg(lt, 2.8, 3.6)) * (1 - ease(seg(lt, 5, 5.8))), blink: (lt % 3.1) < 0.12 });
  seated(190, 455, 0.86, 'parvati', { blink: ((lt + 2) % 3.6) < 0.12 });
  const hold = lt > 5.0;
  ganesha(290, 600, 1.0, { dir: -1, namaste: !hold, hold, bow: hold ? 0 : -0.12 * ease(seg(lt, 0.3, 1.2)), smile: 0.7 + 0.3 * seg(lt, 5, 5.5) });
  mouse(330, 606, 0.8, { dir: -1 });
  const fp = ease(seg(lt, 3.3, 5.0));
  if (lt > 3.0) {
    const fx = lerp(138, 262, fp), fy = lerp(360, 525, fp) - Math.sin(fp * Math.PI) * 70;
    for (let i = 1; i < 10; i++) { const p = clamp(fp - i * 0.03, 0, 1); sparkle(lerp(138, 262, p), lerp(360, 525, p) - Math.sin(p * Math.PI) * 70, 2.6 - i * 0.2, (1 - i / 10) * 0.7 * (1 - seg(lt, 5, 5.6))); }
    fruit(fx, fy, lerp(0.6, 0.85, fp), 1.3 + seg(lt, 5, 5.4) * 1.5);
  }
  for (let i = 0; i < 14; i++) { const p = seg(lt, 5.0, 6.3), a = i / 14 * TAU; sparkle(262 + Math.cos(a) * p * 70, 525 + Math.sin(a) * p * 70, 3, (1 - p) * (lt > 5 ? 1 : 0)); }
}

function sReturn(lt, t) {
  kailashBG(t);
  const land = easeOut(seg(lt, 0, 1.3));
  if (land < 1) { X.save(); X.translate(lerp(-60, 100, land), lerp(150, 560, land)); X.rotate(0.4 * (1 - land)); riderGroup(0, 0, 0.9, { flap: t * 16 }); X.restore(); }
  else {
    peacock(70, 590, 0.9, { fan: 0.15 });
    kartikeya(118, 600, 0.95, { pant: lt * 9, tired: true, dir: 1 });
  }
  ganesha(282, 600, 0.95, { dir: -1, hold: true, smile: 0.9 });
  fruit(254, 527, 0.8, 1.3 + 0.2 * Math.sin(lt * 3));
  mouse(325, 604, 0.8, { dir: -1, hop: Math.max(0, Math.sin(lt * 7)) * 2 });
}

function sMoral(lt, t) {
  const g = X.createRadialGradient(180, 380, 10, 180, 380, 330); g.addColorStop(0, '#d8b47a'); g.addColorStop(0.5, '#8a6a42'); g.addColorStop(1, '#2a1c11');
  X.fillStyle = g; X.fillRect(-100, -100, W + 200, H + 200);
  // big world that shrinks into the circle
  const shrink = ease(seg(lt, 2.4, 5.0));
  const R = lerp(230, 0, shrink);
  if (R > 2) globe(180, 330, R, lt * 0.3, { line: true, a: 0.7 * (1 - shrink * 0.5) });
  // floor line
  X.strokeStyle = 'rgba(40,25,14,0.6)'; X.lineWidth = 1; P(() => { X.moveTo(-100, 462); X.lineTo(460, 462); }); X.stroke();
  const ring = ease(seg(lt, 4.0, 5.5));
  X.save(); X.globalCompositeOperation = 'lighter';
  glow(180, 440, 190 * (0.6 + ring * 0.6), '#ffd890', 0.25 + 0.35 * ease(seg(lt, 5.5, 7.5)));
  X.restore();
  SIL = true;
  seated(150, 455, 0.85, 'shiva', { trident: true }); seated(214, 455, 0.8, 'parvati');
  ganesha(182, 545, 0.6, { dir: -1, namaste: true, rods: false });
  peacock(52, 560, 0.7, { fan: 0.5 }); kartikeya(84, 568, 0.7, { rods: false });
  mouse(230, 548, 0.7, { dir: -1 });
  SIL = false;
  if (ring > 0) { X.save(); X.lineCap = 'round'; X.strokeStyle = `rgba(255,226,150,${0.9 * ring})`; X.lineWidth = 2.2;
    X.shadowColor = '#ffd27a'; X.shadowBlur = 12; P(() => X.ellipse(182, 490, 120, 34, 0, Math.PI / 2, Math.PI / 2 + TAU * ring)); X.stroke(); X.restore(); }
  for (let i = 0; i < 16; i++) { const a = i / 16 * TAU + lt * 0.4; sparkle(182 + Math.cos(a) * 120, 490 + Math.sin(a) * 34, 2.4, ring * (0.4 + 0.6 * Math.sin(lt * 3 + i)) * seg(lt, 5.5, 6.5)); }
}

function sCurtain(lt, t) {
  sMoral(9 + lt, t);
  const c = ease(seg(lt, 0.2, 1.8));
  for (const side of [-1, 1]) {
    X.save(); X.translate(180, 0); X.scale(side, 1); X.translate(-180, 0);
    const xEdge = lerp(-40, 182, c);
    const cg = X.createLinearGradient(xEdge - 220, 0, xEdge, 0);
    for (let i = 0; i <= 10; i++) cg.addColorStop(i / 10, i % 2 ? '#8a2418' : '#c3402f');
    P(() => { X.moveTo(-120, -20); X.lineTo(xEdge, -20); X.quadraticCurveTo(xEdge - 6, 320, xEdge + 4, H + 20); X.lineTo(-120, H + 20); X.closePath(); }); X.fillStyle = cg; X.fill();
    X.restore();
  }
  // valance
  X.fillStyle = '#8f2619'; X.fillRect(-20, -20, W + 40, 48);
  for (let i = 0; i < 12; i++) { P(() => X.arc(i * 32 + 16, 28, 16, 0, Math.PI)); X.fillStyle = '#8f2619'; X.fill(); X.strokeStyle = PAL.gold; X.lineWidth = 1.2; X.stroke(); P(() => X.arc(i * 32 + 16, 46, 2.2, 0, TAU)); X.fillStyle = PAL.gold; X.fill(); }
  X.strokeStyle = PAL.gold; X.lineWidth = 1.5; P(() => { X.moveTo(-20, 28); X.lineTo(W + 20, 28); }); X.stroke();
  X.fillStyle = 'rgba(0,0,0,0.25)'; X.fillRect(-20, 300, W + 40, 400);
}

const SC = [
  { a: 0, b: 9, cam: [1.0, 1.12, 180, 330, 180, 300], f: sKailash },
  { a: 9, b: 17.5, cam: [1.0, 1.06, 180, 340, 180, 350], f: sCourt },
  { a: 17.5, b: 25, cam: [1.22, 1.32, 180, 330, 180, 310], f: sDecree },
  { a: 25, b: 31, cam: [1.0, 1.06, 180, 340, 185, 330], f: sLaunch },
  { a: 31, b: 37, cam: [1.12, 1.25, 195, 470, 200, 470], f: sMouse },
  { a: 37, b: 44, cam: [1, 1.04, 180, 320, 180, 320], f: sTravel },
  { a: 44, b: 54, cam: [1.05, 1.12, 180, 380, 180, 400], f: sCircle },
  { a: 54, b: 60.5, cam: [1.05, 1.15, 200, 420, 210, 440], f: sGift },
  { a: 60.5, b: 65, cam: [1.05, 1.1, 190, 400, 190, 410], f: sReturn },
  { a: 65, b: 74, cam: [1.0, 1.08, 180, 340, 180, 380], f: sMoral },
  { a: 74, b: DURATION, cam: [1, 1, 180, 320, 180, 320], f: sCurtain },
];

const CAPS = [
  [0.4, 3.0, 'Long ago, on *Mount Kailash*,'],
  [3.0, 6.2, 'a *golden fruit* fell from the heavens.'],
  [6.2, 8.8, 'The fruit of *all wisdom*.'],
  [9.3, 11.6, 'But it could not be *shared*.'],
  [11.6, 14.0, 'And Shiva had *two sons*.'],
  [14.0, 15.8, '*Kartikeya*, the swift,'],
  [15.8, 17.3, 'and *Ganesha*, the wise.'],
  [17.7, 20.5, '“Whoever circles the *whole world*'],
  [20.5, 22.5, '*three times* first,'],
  [22.5, 24.8, 'wins the fruit.”'],
  [25.2, 28.0, 'Kartikeya leapt onto his *peacock*'],
  [28.0, 30.8, 'and was gone in a *flash*.'],
  [31.2, 34.5, 'Ganesha looked at his *little mouse*.'],
  [34.5, 36.8, 'And *smiled*.'],
  [37.0, 39.0, 'Over *oceans*.'],
  [39.0, 41.0, 'Over *mountains*.'],
  [41.0, 43.8, 'Across *every land*.'],
  [44.2, 47.5, 'Ganesha simply walked around his *parents*.'],
  [47.5, 49.5, '*Once*.'],
  [49.5, 51.5, '*Twice*.'],
  [51.5, 53.8, '*Three times*.'],
  [54.2, 57.4, '“You are my *whole world*.”'],
  [57.4, 60.3, 'And the fruit was *his*.'],
  [60.7, 64.8, 'When Kartikeya returned, the race was *already won*.'],
  [65.2, 67.5, 'That is why they say,'],
  [67.5, 70.5, 'the world is not *out there*.'],
  [70.5, 73.8, 'It is the ones who *made you*.'],
  [75.6, DURATION, 'Follow for more *stories*.', 520],
];

function drawCaption(t) {
  for (const [a, b, text, yPos] of CAPS) {
    if (t < a || t > b) continue;
    const out = 1 - seg(t, b - 0.25, b);
    const words = []; let hl = false;
    for (const raw of text.split(' ')) { let w = raw; const start = w.startsWith('*') || w.startsWith('“*'); if (start) { hl = true; w = w.replace('*', ''); } const end = w.includes('*'); w = w.replace('*', ''); words.push([w, hl]); if (end) hl = false; }
    const fsz = 15; X.font = `700 ${fsz}px Cinzel`;
    const lines = [[]]; let lw = 0; const maxW = 290, sp = X.measureText(' ').width;
    for (const w of words) { const ww = X.measureText(w[0]).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([...w, ww]); lw += ww + sp; }
    const n = words.length, dw = Math.min(0.2, (b - a) * 0.45 / n);
    let idx = 0; const y0 = yPos || 92;
    lines.forEach((line, li) => {
      const tw = line.reduce((s, w) => s + w[2], 0) + sp * (line.length - 1);
      let x = 180 - tw / 2; const y = y0 + li * (fsz * 1.45);
      for (const [w, h, ww] of line) {
        const p = ease(seg(t, a + idx * dw, a + idx * dw + 0.3)); idx++;
        X.save(); X.globalAlpha = p * out;
        X.shadowColor = 'rgba(0,0,0,0.85)'; X.shadowBlur = 6; X.shadowOffsetY = 1;
        X.fillStyle = h ? PAL.hl : PAL.cream; X.fillText(w, x, y + (1 - p) * 4);
        if (h) { X.shadowBlur = 10; X.shadowColor = 'rgba(130,216,201,0.55)'; X.fillText(w, x, y + (1 - p) * 4); }
        X.restore();
        x += ww + sp;
      }
    });
  }
}

// dust motes + grain
const dust = (() => { const r = rng(99); return Array.from({ length: 45 }, () => [r() * W, r() * H, r() * 0.8 + 0.4, r() * TAU, r() * 6 + 2]); })();
const grains = [];
for (let k = 0; k < 6; k++) {
  const g = document.createElement('canvas'); g.width = 360; g.height = 640; const gx = g.getContext('2d');
  const im = gx.createImageData(360, 640); const r = rng(1000 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 18; }
  gx.putImageData(im, 0, 0); grains.push(g);
}

function render(t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, C.width, C.height);
  X.setTransform(S, 0, 0, S, 0, 0);
  const sc = SC.find(s => t >= s.a && t < s.b) || SC[SC.length - 1];
  const lt = t - sc.a, d = sc.b - sc.a, p = ease(lt / d);
  const [z0, z1, x0, y0, x1, y1] = sc.cam, z = lerp(z0, z1, p), cx = lerp(x0, x1, p), cy = lerp(y0, y1, p);
  X.save(); X.translate(W / 2, H / 2); X.scale(z, z); X.translate(-cx, -cy);
  sc.f(lt, t);
  X.restore();
  // dust
  X.save(); X.globalCompositeOperation = 'lighter';
  for (const [x, y, r, ph, sp] of dust) { const yy = ((y - t * sp) % H + H) % H, xx = x + Math.sin(t * 0.5 + ph) * 10; X.fillStyle = `rgba(255,220,160,${0.25 + 0.2 * Math.sin(t * 2 + ph)})`; P(() => X.arc(xx, yy, r, 0, TAU)); X.fill(); }
  X.restore();
  // vignette
  const v = X.createRadialGradient(180, 330, 120, 180, 330, 420); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.78)');
  X.fillStyle = v; X.fillRect(0, 0, W, H);
  X.fillStyle = 'rgba(255,180,90,0.04)'; X.fillRect(0, 0, W, H);
  // scene fades
  const fin = sc.a === 0 ? seg(lt, 0, 0.8) : seg(lt, 0, 0.35), fout = sc.b >= DURATION ? 1 - seg(t, DURATION - 0.8, DURATION) : 1 - seg(lt, d - 0.35, d);
  const fa = 1 - Math.min(fin, fout); if (fa > 0) { X.fillStyle = `rgba(0,0,0,${fa})`; X.fillRect(0, 0, W, H); }
  drawCaption(t);
  X.drawImage(grains[Math.floor(t * 24) % grains.length], 0, 0);
}

window.DURATION = DURATION;
window.ready = (async () => { await document.fonts.load('700 15px Cinzel'); await document.fonts.ready; render(0); return true; })();
window.frame = (t, q = 0.9) => { render(t); return C.toDataURL('image/jpeg', q); };
</script>
