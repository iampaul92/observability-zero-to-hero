<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Play; font-weight: 500; src: url(fonts/playfair-500.woff2); }
  @font-face { font-family: Arch; src: url(fonts/archivo-black.woff2); }
  @font-face { font-family: Mono; font-weight: 700; src: url(fonts/jbmono-700.woff2); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// "The Bird That Fixed the Bullet Train" — a nature-meets-engineering explainer short.
// Drawn procedurally in a 360x640 logical space, rendered at 3x.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 360, H = 640, S = 3, DUR = TL.dur, SCN = TL.scenes, V = TL.voice, CT = TL.ct;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a)), ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t), 3), ei = t => Math.pow(clamp(t), 3), TAU = Math.PI * 2;
function rng(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const P = f => { X.beginPath(); f(); };
const va = i => V[i][0], vb = i => V[i][1];
const ORANGE = '#ff7a1a', YEL = '#ffd21f', CYAN = '#38c6ff', BLUE = '#1b6cff', HUDBG = 'rgba(10,28,48,.75)';
function glow(x, y, r, col, a) { if (a <= 0) return; const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0)); X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r); }
// word time inside a voice line (by characters): f = 0..1
function wordT(i, word) { const txt = TL.caps[i].replace(/\*/g, ''), k = txt.indexOf(word); return va(i) + (vb(i) - va(i)) * clamp(k / txt.length) * .95; }

// ---------------- HUD ----------------
function typed(str, p) { return str.slice(0, Math.round(str.length * clamp(p))); }
let HUDQ = [];
function hud(...args) { HUDQ.push(args); }
function hudDraw(t, t0, title, rows, o = {}) {
  const p = seg(t, t0, t0 + .5); if (p <= 0) return;
  const x0 = o.x ?? 10, y0 = o.y ?? 16;
  X.save(); X.globalAlpha = o.a ?? 1;
  X.font = '700 5.4px Mono'; X.fillStyle = ORANGE; X.textBaseline = 'top';
  X.fillText(typed(title, p * 1.6), x0, y0);
  rows.forEach(([k, v, col], i) => {
    const q = seg(t, t0 + .15 + i * .18, t0 + .6 + i * .18); if (q <= 0) return;
    const y = y0 + 10 + i * 24, w = o.w ?? 74;
    X.fillStyle = HUDBG; X.fillRect(x0, y, w * ease(q), 19);
    X.strokeStyle = 'rgba(56,198,255,.65)'; X.lineWidth = .6; X.strokeRect(x0, y, w * ease(q), 19);
    X.fillStyle = CYAN; X.fillRect(x0, y, 1.6, 19 * ease(q));
    X.font = '700 4.2px Mono'; X.fillStyle = 'rgba(190,210,230,.8)'; X.fillText(typed(k, q * 2), x0 + 4, y + 3);
    X.font = '700 6.6px Mono'; X.fillStyle = col || '#7fd3ff'; X.fillText(typed(v, (q - .3) * 2), x0 + 4, y + 10);
  });
  X.restore();
}
function tag(t, t0, txt, x, y, col = ORANGE, o = {}) {   // small floating label with a leader line
  const p = seg(t, t0, t0 + .4); if (p <= 0) return;
  X.save(); X.globalAlpha = p * (o.a ?? 1);
  if (o.to) { X.strokeStyle = col; X.lineWidth = .6; P(() => { X.moveTo(o.to[0], o.to[1]); X.lineTo(x, y + 4); }); X.stroke(); P(() => X.arc(o.to[0], o.to[1], 1.6, 0, TAU)); X.fillStyle = col; X.fill(); }
  X.font = '700 5.6px Mono'; const w = X.measureText(txt).width + 8;
  X.fillStyle = 'rgba(0,0,0,.7)'; X.fillRect(x - 1, y - 1, w * ease(p), 11); X.strokeStyle = col; X.lineWidth = .6; X.strokeRect(x - 1, y - 1, w * ease(p), 11);
  X.fillStyle = col; X.textBaseline = 'top'; X.fillText(typed(txt, p * 1.5), x + 3, y + 2);
  X.restore();
}
function bigNum(t, t0, val, suffix, x, y, size, col, sub, o = {}) {
  const p = seg(t, t0, t0 + .7); if (p <= 0) return;
  const v = o.noCount ? val : Math.round(val * eo(p));
  X.save(); X.globalAlpha = seg(t, t0, t0 + .2); X.textAlign = o.align || 'center'; X.textBaseline = 'alphabetic';
  X.font = `${size}px Arch`; X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 8;
  X.fillText((o.prefix || '') + v + suffix, x, y + (1 - eo(p)) * 6);
  X.shadowBlur = 0; if (sub) { X.font = `500 ${size * .26}px Play`; X.fillStyle = 'rgba(230,230,230,.75)'; X.fillText(sub, x, y + size * .38); }
  X.restore();
}
function grid(a = .07) { X.strokeStyle = `rgba(56,198,255,${a})`; X.lineWidth = .4; for (let x = 0; x <= W; x += 20) { P(() => { X.moveTo(x, 0); X.lineTo(x, H); }); X.stroke(); } for (let y = 0; y <= H; y += 20) { P(() => { X.moveTo(0, y); X.lineTo(W, y); }); X.stroke(); } }

// ---------------- the kingfisher (faces +x; beak tip at about (+58, -6) for s=1) ----------------
function kingfisher(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.rotate(o.rot || 0); X.scale(s, s);
  const back = X.createLinearGradient(-30, -30, 20, 10); back.addColorStop(0, '#0a5b8f'); back.addColorStop(.5, '#14a3d0'); back.addColorStop(1, '#26d0e8');
  const belly = X.createLinearGradient(0, -6, 0, 22); belly.addColorStop(0, '#f08a33'); belly.addColorStop(1, '#b8501a');
  X.shadowColor = 'rgba(56,198,255,.35)'; X.shadowBlur = 14;
  // tail
  P(() => { X.moveTo(-26, 4); X.lineTo(-46, 14 - (o.dive ? 10 : 0)); X.lineTo(-44, 20 - (o.dive ? 12 : 0)); X.lineTo(-22, 12); X.closePath(); }); X.fillStyle = '#0b4f7d'; X.fill();
  X.shadowBlur = 0;
  // body
  P(() => { X.moveTo(18, -12); X.bezierCurveTo(6, -22, -24, -16, -30, 4); X.bezierCurveTo(-26, 18, -4, 24, 10, 16); X.bezierCurveTo(20, 10, 24, -2, 18, -12); }); X.fillStyle = back; X.fill();
  P(() => { X.moveTo(16, -4); X.bezierCurveTo(18, 8, 4, 22, -14, 18); X.bezierCurveTo(-4, 12, 8, 4, 16, -4); }); X.fillStyle = belly; X.fill();
  // wing with feather scallops
  P(() => { X.moveTo(8, -10); X.bezierCurveTo(-6, -16, -26, -10, -34, 6 + (o.dive ? -6 : 0)); X.bezierCurveTo(-18, 8, -2, 6, 8, -10); }); X.fillStyle = '#0d6fa0'; X.fill();
  X.strokeStyle = 'rgba(120,230,255,.55)'; X.lineWidth = .7;
  for (let i = 0; i < 6; i++) { P(() => X.arc(-4 - i * 4.5, -6 + i * 1.6, 3.2, .3, Math.PI - .3)); X.stroke(); }
  const r = rng(9); X.fillStyle = 'rgba(160,240,255,.8)'; for (let i = 0; i < 26; i++) { P(() => X.arc(-16 + r() * 30, -14 + r() * 10, .5 + r() * .5, 0, TAU)); X.fill(); }
  // head
  P(() => X.arc(20, -12, 11, 0, TAU)); X.fillStyle = back; X.fill();
  P(() => { X.moveTo(26, -18); X.bezierCurveTo(14, -16, 10, -10, 12, -4); X.lineTo(22, -6); X.closePath(); }); X.fillStyle = '#e9772c'; X.fill();   // orange lores/cheek
  P(() => { X.moveTo(15, -3); X.bezierCurveTo(14, 2, 18, 4, 24, 0); X.lineTo(26, -5); X.closePath(); }); X.fillStyle = '#f4f1e8'; X.fill();     // white throat
  P(() => { X.moveTo(8, -6); X.quadraticCurveTo(9, -1, 13, 0); X.lineTo(11, -7); X.closePath(); }); X.fillStyle = '#f4f1e8'; X.fill();
  // beak: long, narrow, dark
  const bl = o.beakLen || 1;
  P(() => { X.moveTo(28, -16); X.lineTo(28 + 30 * bl, -6.5); X.lineTo(28, -8); X.closePath(); }); const bk = X.createLinearGradient(28, -16, 28, -6); bk.addColorStop(0, '#2b2b30'); bk.addColorStop(1, '#0c0c0e'); X.fillStyle = bk; X.fill();
  X.strokeStyle = 'rgba(255,255,255,.25)'; X.lineWidth = .5; P(() => { X.moveTo(29, -14); X.lineTo(28 + 28 * bl, -7.2); }); X.stroke();
  // eye
  P(() => X.arc(22, -14, 2.6, 0, TAU)); X.fillStyle = '#050505'; X.fill(); P(() => X.arc(22.8, -14.8, .8, 0, TAU)); X.fillStyle = '#fff'; X.fill();
  // feet
  if (!o.dive) { X.strokeStyle = '#e8463a'; X.lineWidth = 1.6; P(() => { X.moveTo(0, 19); X.lineTo(-1, 25); X.moveTo(5, 18); X.lineTo(5, 25); }); X.stroke(); }
  // rim light
  X.strokeStyle = 'rgba(140,235,255,.5)'; X.lineWidth = .8; P(() => { X.moveTo(18, -23); X.bezierCurveTo(4, -24, -20, -18, -30, 2); }); X.stroke();
  X.restore();
}

// ---------------- the train (side profile, faces +x; nose tip at x) ----------------
// m: 0 = blunt early nose, 1 = long kingfisher-like nose; L = car length behind the nose
function noseShape(m, nl) {   // returns top and bottom curve control points relative to nose tip (0,0), going back to -nl
  const k = lerp(.32, 1, m), h = 22;
  return { nl: nl * k, top: [[0, -1 - (1 - m) * 6], [-nl * k * lerp(.15, .35, m), -h * lerp(.75, .55, m)], [-nl * k, -h]], bot: [[-nl * k * .3, 7], [-nl * k, 8]] };
}
function train(x, y, s, o = {}) {
  const m = o.m ?? 1, nl = o.nl || 90, L = o.L || 180;
  X.save(); X.translate(x, y); X.scale(s, s);
  const ns = noseShape(m, nl), N = ns.nl;
  const body = X.createLinearGradient(0, -24, 0, 10); body.addColorStop(0, '#eef2f6'); body.addColorStop(.55, '#aeb8c4'); body.addColorStop(1, '#5d6670');
  const path = () => { X.moveTo(0, ns.top[0][1]); X.bezierCurveTo(ns.top[1][0], ns.top[1][1] * .4, ns.top[1][0], ns.top[1][1], N * -1, -22); X.lineTo(-N - L, -22); X.lineTo(-N - L, 9); X.lineTo(-N, 9); X.quadraticCurveTo(-N * .3, 9, 0, 3 - (1 - m) * 1); X.quadraticCurveTo(2, 0, 0, ns.top[0][1]); };
  X.shadowColor = o.glow || 'rgba(56,198,255,.25)'; X.shadowBlur = 12; P(path); X.fillStyle = body; X.fill(); X.shadowBlur = 0;
  // blue stripe + window band
  X.save(); P(path); X.clip();
  X.fillStyle = '#1c3f8f'; X.fillRect(-N - L, -1, L + N, 3.2);
  X.fillStyle = '#0d1a2e'; X.fillRect(-N - L + 6, -15, L - 4, 6);
  for (let i = 0; i < 14; i++) { X.fillStyle = 'rgba(120,190,255,.35)'; X.fillRect(-N - L + 9 + i * 12.5, -14, 8, 4); }
  P(() => { X.moveTo(-N * .55, -19.5); X.quadraticCurveTo(-N * .32, -18, -N * .22, -12); X.lineTo(-N * .5, -12); X.closePath(); }); X.fillStyle = '#0d1a2e'; X.fill();  // cockpit
  X.restore();
  X.strokeStyle = 'rgba(255,255,255,.55)'; X.lineWidth = .5; P(() => { X.moveTo(-3, ns.top[0][1] + 1); X.bezierCurveTo(ns.top[1][0], ns.top[1][1] * .4 + 1, ns.top[1][0], ns.top[1][1] + 1, -N, -21); }); X.stroke();
  // bogies
  for (const bx of [-N - 20, -N - L + 24]) { X.fillStyle = '#20252b'; X.fillRect(bx - 12, 9, 24, 4); for (const w of [-7, 7]) { P(() => X.arc(bx + w, 14, 3, 0, TAU)); X.fillStyle = '#121417'; X.fill(); } }
  X.restore();
  return { tip: [x, y + ns.top[0][1] * s] };
}

// ---------------- sets ----------------
const stars = (() => { const r = rng(4); return Array.from({ length: 70 }, () => [r() * W, r() * H * .5, r() * .9 + .2]); })();
function nightSky(t, a = 1) { stars.forEach(([x, y, r], i) => { X.fillStyle = `rgba(200,230,255,${a * (.3 + .3 * Math.sin(t * 2 + i))})`; P(() => X.arc(x, y, r, 0, TAU)); X.fill(); }); }
function speedLines(t, y0, y1, a = 1, n = 22) { const r = rng(12); for (let i = 0; i < n; i++) { const y = lerp(y0, y1, r()), sp = 300 + r() * 300, len = 30 + r() * 60, x = W + 60 - ((t * sp + r() * 600) % (W + 200)); X.strokeStyle = `rgba(140,210,255,${a * (.15 + r() * .35)})`; X.lineWidth = .6 + r(); P(() => { X.moveTo(x, y); X.lineTo(x + len, y); }); X.stroke(); } }

// tunnel cutaway: mountain with a bore at y = TY
const TY = 300, PORTAL = 250;
function mountain(t, a = 1) {
  const g = X.createLinearGradient(0, 160, 0, 360); g.addColorStop(0, '#1d2a35'); g.addColorStop(1, '#0d1217');
  P(() => { X.moveTo(-20, 360); X.lineTo(-20, 230); X.quadraticCurveTo(80, 150, 160, 175); X.quadraticCurveTo(220, 190, PORTAL, 250); X.lineTo(PORTAL, 360); X.closePath(); });
  X.fillStyle = g; X.fill(); X.strokeStyle = 'rgba(56,198,255,.4)'; X.lineWidth = .8; X.stroke();
  // cutaway bore
  X.fillStyle = '#05080b'; X.fillRect(-20, TY - 30, PORTAL + 20, 44);
  X.strokeStyle = 'rgba(56,198,255,.55)'; X.setLineDash([3, 2]); X.strokeRect(-20, TY - 30, PORTAL + 20, 44); X.setLineDash([]);
  // portal ring
  X.strokeStyle = '#8c98a4'; X.lineWidth = 3; P(() => { X.moveTo(PORTAL, TY + 14); X.lineTo(PORTAL, TY - 32); }); X.stroke();
  // ground + track
  X.fillStyle = '#0b0f13'; X.fillRect(-20, TY + 14, W + 40, 60); X.strokeStyle = '#3a444e'; X.lineWidth = 1; P(() => { X.moveTo(-20, TY + 14.5); X.lineTo(W + 20, TY + 14.5); }); X.stroke();
}
function airParticles(t, noseX, dens, a = 1) {   // air ahead of the nose, compressed toward the exit
  const r = rng(77);
  for (let i = 0; i < 160; i++) {
    let u = r(), yy = TY - 28 + r() * 40;
    const span = Math.max(8, PORTAL - noseX);
    const xx = noseX + 4 + Math.pow(u, 1 + dens * 2.5) * span;
    if (xx > PORTAL) continue;
    const heat = 1 - (xx - noseX) / span;
    X.fillStyle = `rgba(${Math.round(lerp(80, 255, heat * dens))},${Math.round(lerp(180, 120, heat * dens))},${Math.round(lerp(255, 40, heat * dens))},${a * (.35 + .5 * heat)})`;
    P(() => X.arc(xx + Math.sin(t * 9 + i) * .6, yy, .9, 0, TAU)); X.fill();
  }
}
function boomRings(t, t0, x, y, a = 1) {
  for (let k = 0; k < 4; k++) {
    const p = seg(t, t0 + k * .12, t0 + k * .12 + 1.4); if (p <= 0 || p >= 1) continue;
    X.strokeStyle = `rgba(255,122,26,${a * (1 - p)})`; X.lineWidth = 3 * (1 - p) + .5; X.shadowColor = ORANGE; X.shadowBlur = 10;
    P(() => X.arc(x, y, 10 + p * 170, -1.25, 1.25)); X.stroke(); X.shadowBlur = 0;
  }
}
function house(x, y, s, lit) {
  X.save(); X.translate(x, y); X.scale(s, s);
  P(() => { X.moveTo(-14, 0); X.lineTo(-14, -16); X.lineTo(0, -28); X.lineTo(14, -16); X.lineTo(14, 0); X.closePath(); });
  X.fillStyle = '#141b22'; X.fill(); X.strokeStyle = 'rgba(56,198,255,.45)'; X.lineWidth = .7; X.stroke();
  X.fillStyle = lit ? 'rgba(255,200,90,.9)' : 'rgba(255,200,90,.25)'; X.fillRect(-8, -12, 5, 5); X.fillRect(3, -12, 5, 5);
  X.restore();
}
function engineer(x, y, s, binos) {
  X.save(); X.translate(x, y); X.scale(s, s); X.fillStyle = '#0e141a'; X.strokeStyle = 'rgba(56,198,255,.55)'; X.lineWidth = .8;
  P(() => { X.moveTo(-18, 0); X.lineTo(-14, -60); X.quadraticCurveTo(0, -72, 14, -60); X.lineTo(18, 0); X.closePath(); }); X.fill(); X.stroke();
  P(() => X.arc(0, -80, 11, 0, TAU)); X.fill(); X.stroke();
  // arms raising binoculars
  const b = ease(binos);
  P(() => { X.moveTo(8, -60); X.lineTo(lerp(16, 16, b), lerp(-36, -78, b)); X.lineTo(lerp(18, 12, b), lerp(-30, -80, b)); }); X.lineWidth = 6; X.strokeStyle = '#0e141a'; X.stroke();
  X.fillStyle = '#26303a'; X.fillRect(lerp(14, 8, b), lerp(-34, -86, b), 10, 7);
  X.restore();
}
function water(y, a = 1) {
  const g = X.createLinearGradient(0, y, 0, H); g.addColorStop(0, `rgba(20,110,170,${.85 * a})`); g.addColorStop(1, `rgba(3,20,40,${a})`);
  X.fillStyle = g; X.fillRect(0, y, W, H - y);
  X.strokeStyle = `rgba(140,220,255,${.8 * a})`; X.lineWidth = 1; P(() => { X.moveTo(0, y); X.lineTo(W, y); }); X.stroke();
}
// streamlines around a shape: path(x) gives the half-thickness of the body at x (0 outside)
function streamlines(t, x0, x1, cy, thick, turb, a = 1, col = '56,198,255') {
  for (let k = -6; k <= 6; k++) {
    if (k === 0) continue;
    const off = k * 9;
    X.strokeStyle = `rgba(${col},${a * (.75 - Math.abs(k) * .07)})`; X.lineWidth = .8;
    P(() => {
      for (let i = 0; i <= 90; i++) {
        const x = lerp(x0, x1, i / 90), th = thick(x), push = th > 0 ? th * Math.exp(-Math.abs(off) / 30) : 0;
        let y = cy + off + Math.sign(off) * push;
        const behind = turb(x); if (behind > 0) y += Math.sin(x * .35 + t * 14 + k * 1.7) * behind * (1.2 - Math.abs(k) / 7);
        i ? X.lineTo(x, y) : X.moveTo(x, y);
      }
    });
    X.stroke();
    // a moving dash on each line
    const px = x0 + ((t * 90 + k * 37) % (x1 - x0)); X.fillStyle = `rgba(255,255,255,${a * .8})`; P(() => X.arc(px, cy + off, .9, 0, TAU)); X.fill();
  }
}

// ---------------- scenes ----------------
function sTrain(t) {
  nightSky(t, .6);
  speedLines(t, 250, 330, 1);
  const x = lerp(-40, 300, eo(seg(t, 0, 2.5)));
  train(x, 300, 1.05, { m: .15, nl: 80, L: 400 });
  hud(t, .2, 'SUBJECT · SHINKANSEN', [['ERA', '1990s'], ['TYPE', 'HIGH-SPEED RAIL']]);
  const w = wordT(0, 'problem');
  if (t > w) { const p = seg(t, w, w + .3); X.save(); X.globalAlpha = p * (.7 + .3 * Math.sin(t * 12)); tag(t, w, '⚠ ANOMALY DETECTED', 210, 210, '#ff3b30', { to: [x - 10, 285] }); X.restore(); }
}
function sTunnel(t) {
  nightSky(t, .5);
  mountain(t);
  const a = SCN.tunnel[0], boomT = wordT(2, 'boom');
  const nose = lerp(-60, PORTAL - 4, ease(seg(t, a, boomT)));
  const after = seg(t, boomT, boomT + 1.2);
  const nx = t < boomT ? nose : lerp(PORTAL - 4, PORTAL + 70, eo(after));
  X.save(); X.beginPath(); X.rect(-20, TY - 30, W + 60, 44); X.clip();
  train(nx, TY, .9, { m: .15, nl: 80, L: 400 }); X.restore();
  if (t < boomT + .1) airParticles(t, nx, seg(t, a + 1, boomT), 1);
  // the explanation after the boom: a held pressure diagram
  const ex = seg(t, va(3) - .1, va(3) + .4);
  if (ex > 0) { X.save(); X.globalAlpha = ex * .9; airParticles(t, PORTAL - 70, 1, 1); X.restore(); tag(t, wordT(3, 'squeezed'), 'COMPRESSED AIR', 120, 236, ORANGE, { to: [PORTAL - 20, TY - 10] }); tag(t, wordT(3, 'exploding'), 'PRESSURE WAVE', 186, 336, '#ff3b30', { to: [PORTAL + 26, TY - 10] }); }
  boomRings(t, boomT, PORTAL + 2, TY - 8); if (ex > 0) boomRings(t, wordT(3, 'exploding'), PORTAL + 2, TY - 8, .8);
  const fl = 1 - seg(t, boomT, boomT + .35); if (t > boomT) glow(PORTAL + 6, TY - 8, 90, 'rgba(255,170,80,A)', fl * .9);
  hud(t, a + .2, 'PROBLEM · TUNNEL BOOM', [['CAUSE', 'AIR PRESSURE'], ['LOUDNESS', t > boomT ? 'EXTREME' : '—', t > boomT ? '#ff3b30' : null]]);
}
function sHouses(t) {
  nightSky(t, .5);
  X.fillStyle = '#0b0f13'; P(() => { X.moveTo(-20, 330); X.quadraticCurveTo(180, 290, 380, 320); X.lineTo(380, 400); X.lineTo(-20, 400); X.closePath(); }); X.fill();
  X.strokeStyle = 'rgba(56,198,255,.35)'; X.lineWidth = .8; X.stroke();
  P(() => { X.moveTo(-20, 330); X.lineTo(30, 330); X.lineTo(30, 260); X.quadraticCurveTo(10, 220, -20, 230); }); X.fillStyle = '#1a242e'; X.fill();
  X.fillStyle = '#05080b'; X.fillRect(18, 300, 14, 30);
